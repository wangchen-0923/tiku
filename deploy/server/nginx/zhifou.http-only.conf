# ═══════════════════════════════════════════════════════════════════
#  知否题库 · Nginx 临时配置（只有 80 端口，专门用来「申请 SSL 证书」）
# ───────────────────────────────────────────────────────────────────
#  【什么时候用】建好站点、但还没申请到 Let's Encrypt 证书的这几分钟。
#                证书申请成功后，回到「设置 → 配置文件」，
#                把这里的内容整段替换成 zhifou.conf（HTTPS 完整版）。
#
#  【为什么需要它】完整版里有 443 段，证书文件还不存在时 Nginx 根本起不来，
#                 站点起不来 → 证书又申请不了 → 死循环。
#                 这份只监听 80，先让证书能申请下来。
#
#  【粘贴位置】宝塔面板 → 网站 → 站点 → 设置 → 配置文件（全选删除后粘贴）
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # ★★★ 改成你的域名（不带 https://）★★★
    server_name  zhifou.example.com;

    root /www/wwwroot/zhifou/dist;
    index index.html;

    access_log  /www/wwwlogs/zhifou.access.log;
    error_log   /www/wwwlogs/zhifou.error.log;

    client_max_body_size 50m;

    # ── 证书校验：宝塔申请 Let's Encrypt 时会往站点根目录写这个目录 ──
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/zhifou/dist;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ── 临时阶段可以直接用 http 打开网站，方便确认前端有没有传对 ──
    location ^~ /static/ {
        alias /opt/zhifou/staticfiles/;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
