# ═══════════════════════════════════════════════════════════════════
#  知否题库 · Nginx 站点配置（宝塔面板 11.x 专用 · HTTPS 完整版）
# ───────────────────────────────────────────────────────────────────
#  【粘贴位置】宝塔面板 → 网站 → 站点 → 找到本站点 → 设置 → 配置文件
#              把框里原来的内容「全选删除」，整段粘贴下面全部内容 → 保存
#
#  ★ 必须手工处理的 3 件事（前两件不改就上不了网，第三件不做以后必出事）：
#      1. 两个 server 块里的 server_name        → 改成你自己的域名
#      2. 443 段里的 ssl_certificate / key 路径  → 改成宝塔证书目录里的真实路径
#         （目录名是你的【域名】，不是 zhifou；用 ls -l /www/server/panel/vhost/cert/ 看）
#      3. 见 443 段「HTTPS 证书」注释里的【强制步骤】：
#         粘贴前先把宝塔的 #SSL-START ... #SSL-END 整段抄出来，
#         粘贴后原样贴回，并删掉本文件自带的那两行 ssl_certificate。
#         不做这一步，三个月后证书一续期，站点就再也起不来。
#
#  ★ 如果你还没申请 SSL 证书：
#      现在就粘贴这份会报错（证书文件不存在，Nginx 起不来）。
#      请先用同目录的 zhifou.http-only.conf（只有 80 端口，用于申请证书），
#      证书申请成功之后再换成这份完整版。
#
#  ★ 路由优先级是怎么保证 /api/ 不会被前端页面吞掉的：
#      Nginx 的「前缀 location」按「最长匹配」选中，跟书写顺序无关。
#      /static/ /health/ /api/ /admin/ /assets/ 都比 / 长，所以一定先命中；
#      只有谁都不匹配的请求才会落到最后的 location / 交给前端页面兜底。
#      另外这里全部用 ^~ 前缀匹配，不使用正则 location，
#      避免正则反过来抢走这些前缀。
# ═══════════════════════════════════════════════════════════════════

# 后端 Django 容器（只监听本机 127.0.0.1:8000，外网访问不到）
upstream zhifou_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ───────────────────────────────────────────────────────────────────
#  80 端口：只做一件事 —— 全部跳转到 HTTPS
# ───────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # ★★★ 改成你的域名（不带 https://）★★★
    server_name  zhifou.example.com;

    # 证书校验目录：必须放在 301 跳转之前，
    # 否则申请 / 续期 Let's Encrypt 证书时会因为被跳转而失败。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/zhifou/dist;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log  /www/wwwlogs/zhifou.access.log;
    error_log   /www/wwwlogs/zhifou.error.log;
}

# ───────────────────────────────────────────────────────────────────
#  443 端口：正式站点
# ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ★★★ 改成你的域名（不带 https://）★★★
    server_name  zhifou.example.com;

    # ── HTTPS 证书 ────────────────────────────────────────────────
    # ★★★ 强制步骤（跳过这步不是"以后再说"，是三个月后证书一续期站点就挂，
    #     而且报错全是英文，现场根本看不出原因）：
    #
    #   c1) 粘贴本配置【之前】，先回到「配置文件」框里，把宝塔自动生成的那一整段
    #       #SSL-START ... #SSL-END 【整段复制出来】，临时存到记事本；
    #   c2) 粘贴完本配置后，把刚才那段【原样贴回】到下面这两行的位置；
    #   c3) 贴回之后，【删掉本文件自带的下面这两行 ssl_certificate】。
    #
    #   一句话原则：证书那两行永远归宝塔所有，我们只管其它配置。
    #
    #   为什么必须这么做：宝塔靠 #SSL-START / #SSL-END 这段注释来判断
    #   "这个站点归它管"。找不到这段，你在面板上点「强制 HTTPS」、
    #   或者重新部署一次证书时，宝塔会【再插一套】ssl_certificate 指令，
    #   同一个 server 块里出现两条重复指令 → nginx -t 直接失败 → 整个站点起不来。
    #
    # ── 路径怎么填 ──
    # 宝塔的证书目录按【站点名】命名，而站点名 = 你建站时填的第一个域名，
    # 跟「根目录」叫什么完全无关（根目录叫 zhifou，证书目录也不叫 zhifou）。
    #       /www/server/panel/vhost/cert/<你的域名>/fullchain.pem
    #       /www/server/panel/vhost/cert/<你的域名>/privkey.pem
    # 例：域名 lszyzz.zj.cn
    #       /www/server/panel/vhost/cert/lszyzz.zj.cn/fullchain.pem
    # 也可以直接从面板抄：宝塔 → 网站 → 站点 → 设置 → SSL → 证书
    #                         → 「证书路径 / 密钥路径」
    #
    # ── 判断命令（别猜，列出来看真实目录名，以 ls 显示的为准）──
    #       ls -l /www/server/panel/vhost/cert/
    #
    # ── 改完自检（结果必须等于 1；等于 2 就是重复了，nginx 一定起不来）──
    #       grep -c "ssl_certificate " /www/server/panel/vhost/nginx/<你的域名>.conf
    #       nginx -t
    ssl_certificate      /www/server/panel/vhost/cert/<你的域名>/fullchain.pem;
    ssl_certificate_key  /www/server/panel/vhost/cert/<你的域名>/privkey.pem;

    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    access_log  /www/wwwlogs/zhifou.access.log;
    error_log   /www/wwwlogs/zhifou.error.log warn;

    # ── 基础参数 ──
    # 扫描件 / 拍照上传可能几十 MB，太小会直接 413
    client_max_body_size        50m;
    client_body_timeout         300s;
    send_timeout                300s;
    keepalive_timeout           65s;

    # ── 压缩（减少首屏加载时间）──
    gzip               on;
    gzip_vary          on;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_disable       "msie6";
    gzip_types         text/plain text/css text/xml text/javascript
                       application/javascript application/x-javascript
                       application/json application/xml application/xml+rss
                       image/svg+xml font/woff2 application/wasm;

    # ── 前端 SPA 静态目录（npm run build 后上传到这里）──
    root  /www/wwwroot/zhifou/dist;
    index index.html;

    # ════════════════════════════════════════════════════════
    #  优先级 1：Django 静态资源（/admin/ 的 CSS/JS 全靠它）
    #  宿主机目录 /opt/zhifou/staticfiles 由 collectstatic 生成
    # ════════════════════════════════════════════════════════
    location ^~ /static/ {
        alias /opt/zhifou/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }

    # ════════════════════════════════════════════════════════
    #  优先级 2：健康检查（容器 / 监控 / 排障第一步就 curl 它）
    # ════════════════════════════════════════════════════════
    location ^~ /health/ {
        proxy_pass http://zhifou_backend;
        include    /opt/zhifou/nginx/proxy_headers.conf;
        access_log off;
    }

    # ════════════════════════════════════════════════════════
    #  优先级 3：后端 API（/api/v1/... 全部走这里）
    #  ★ 没有结尾斜杠的 proxy_pass 会原样保留 /api/ 前缀
    # ════════════════════════════════════════════════════════
    location ^~ /api/ {
        proxy_pass http://zhifou_backend;
        include    /opt/zhifou/nginx/proxy_headers.conf;
    }

    # ════════════════════════════════════════════════════════
    #  优先级 4：Django 后台（/admin/）
    #  登录页面跳 /admin/login/ 也在这一段里，不会掉到前端
    # ════════════════════════════════════════════════════════
    location ^~ /admin/ {
        proxy_pass http://zhifou_backend;
        include    /opt/zhifou/nginx/proxy_headers.conf;
    }

    # ════════════════════════════════════════════════════════
    #  媒体文件（题目配图 / 扫描件 / 学生答题卡）
    #  ★★ 有意关闭的安全设置，请勿打开下面这一段 ★★
    #
    #  为什么关：
    #    知否全站没有任何代码会生成 /media/ 开头的网址。
    #    settings 里虽然定义了 MEDIA_URL="/media/"，但零处引用；
    #    本地存储的 signed_url() 返回的是 file://，不会产生 HTTP 地址。
    #    真正的读取路径是后端接口：
    #        /api/v1/media/assets/{id}/content/
    #    它【要登录】、【还要校验归属机构】。
    #    而下面这段一旦打开，就是「任何人猜到文件路径即可免登录下载」，
    #    学生答题卡照片会直接裸奔在公网上。
    #
    #  ★ 如果将来真的必须重新启用（仅当后端改成对外直接吐 /media/xxx.png 时），
    #    下面三处【必须改】，否则就是埋雷：
    #      c1) add_header Cache-Control "public";  →  改成 "private, no-store"
    #      c2) access_log off;                     →  绝不能 off，必须单独记一份日志。
    #          原来这条最坏：口子真被人用过也查不出来。
    #      c3) log_not_found off;                  →  改成 on
    #
    #  改成腾讯云 COS / 对象存储（ZF_STORAGE_BACKEND=s3）后，
    #  字节不再由本机提供，这段永远用不上，可以直接删掉。
    # ════════════════════════════════════════════════════════
    # ★★★ 下面整段保持注释状态，请勿取消注释 ★★★
    # location ^~ /media/ {
    #     alias /opt/zhifou/media/;
    #     expires 7d;
    #     add_header Cache-Control "public";   # ★ 启用时改 "private, no-store"
    #     access_log off;                      # ★ 启用时必须改成单独日志文件，不能 off
    #     log_not_found off;                   # ★ 启用时改成 on
    # }

    # ════════════════════════════════════════════════════════
    #  优先级 5：前端构建产物（Vite 默认 /assets/，文件名带 hash 可长缓存）
    # ════════════════════════════════════════════════════════
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ════════════════════════════════════════════════════════
    #  最后兜底：所有其它路径 → 前端单页应用
    #  前端用的是 history 路由，/login、/assignments/12、/s/<token>
    #  这些地址必须是「刷新/直接打开」也能用，所以一律回 index.html。
    #  只有当用户直接访问 / 时，才可能出现同名 index.html 缓存问题，
    #  下面这一段强制不缓存首页。
    # ════════════════════════════════════════════════════════
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
