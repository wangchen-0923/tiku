# ═══════════════════════════════════════════════════════════════════
#  知否题库 · 反向代理通用请求头（被 zhifou.conf 用 include 引用）
# ───────────────────────────────────────────────────────────────────
#  【放到服务器的哪个位置】  /opt/zhifou/nginx/proxy_headers.conf
#  【为什么单独一个文件】    三处 location（/api/ /admin/ /health/）都要用，
#                            抽出来避免改一处漏两处。
#
#  ★ 如果老师懒得多传一个文件：把 include 那一行删掉，
#    把下面 8 行原样复制到每个 location ^~ ... { } 里面即可。
# ═══════════════════════════════════════════════════════════════════

proxy_http_version 1.1;

# ★ 下面 4 个头是必须的，不能删：
#   X-Forwarded-Proto 决定了 Django 认为「当前是 http 还是 https」，
#   后端 production.py 里的 SECURE_PROXY_SSL_HEADER 依赖它。
#   少了它：Django 会把 HTTPS 请求误判成 HTTP → 登录后立刻掉线 / 一直 301。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# 与 upstream 里的 keepalive 32 配套：清空 Connection 才能复用连接
proxy_set_header Connection "";

# OCR 识别 / 学情重算 / PDF 生成都是慢请求，超时给到 300 秒
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# 后端出错时不要把自己的 5xx 页面细节暴露出去
proxy_intercept_errors off;
