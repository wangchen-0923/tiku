# ═══════════════════════════════════════════════════════════════════
#  知否题库 · 系统 Nginx 配置（域名未备案期间，用公网 IP 访问）
# ───────────────────────────────────────────────────────────────────
#  【放置位置】/etc/nginx/conf.d/zhifou.conf
#              （系统 Nginx，不是宝塔那套）
#
#  【为什么用系统 Nginx 而不是宝塔 Nginx】
#    这台机器上 :80 由 /usr/sbin/nginx 持有，它的主配置是
#    /etc/nginx/nginx.conf，只 include /etc/nginx/conf.d/*.conf。
#    宝塔那套（/www/server/nginx）虽然装了，但**没有运行**，
#    所以宝塔「网站」里建的站点、贴的配置从来没被加载过。
#
#  【为什么不会顶掉活动广场】
#    活动广场（职业体验日历）那份配置用的是 `server_name _`，
#    `_` 不是通配符，永远不匹配真实 Host，所以它只能靠
#    「listen 80 的默认站点」这个身份接客。
#    本文件用**精确的 IP** 作为 server_name —— Nginx 选站顺序是
#    「精确名 → 通配符 → 正则 → 默认站点」，精确匹配优先，
#    所以：Host 是 IP 的请求归知否，其它 Host 仍然归活动广场。
#
#  【端口约定】
#    宿主机 8001 → 容器内 8000（gunicorn）。
#    ★ 不用 8000 是因为这台机器上 8000 已被 uvicorn（活动广场后端）占用。
#    ★ 三处必须一致：docker-compose.yml 的 ports、
#      .env 的 ZF_WEB_HOST_PORT、本文件两处 proxy_pass。
#
#  【备案通过后怎么换】
#    把本文件删掉，改用 zhifou.conf（HTTPS 完整版）。
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # ★★★ 精确到 IP，只认这个 Host ★★★
    server_name 124.220.77.198;

    root /www/wwwroot/zhifou/dist;
    index index.html;

    access_log /var/log/nginx/zhifou.access.log;
    error_log  /var/log/nginx/zhifou.error.log;

    # 扫描件 / 拍照上传可能几十 MB，太小会直接 413
    client_max_body_size 50m;
    client_body_timeout  300s;
    send_timeout         300s;

    # ════════════════════════════════════════════════════════
    #  优先级 1：Django 静态资源（/admin/ 的 CSS/JS 全靠它）
    #  宿主机目录 /opt/zhifou/staticfiles 由 collectstatic 生成
    # ════════════════════════════════════════════════════════
    location ^~ /static/ {
        alias /opt/zhifou/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }

    # ════════════════════════════════════════════════════════
    #  优先级 2：健康检查
    # ════════════════════════════════════════════════════════
    location ^~ /health/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # ════════════════════════════════════════════════════════
    #  优先级 3：后端 API（/api/v1/... 全部走这里）
    #  ★ proxy_pass 结尾没有斜杠 → 原样保留 /api/ 前缀
    # ════════════════════════════════════════════════════════
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # ════════════════════════════════════════════════════════
    #  优先级 4：Django 后台（/admin/）
    # ════════════════════════════════════════════════════════
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # ════════════════════════════════════════════════════════
    #  媒体文件（题目配图 / 扫描件 / 学生答题卡）
    #  ★★ 有意不配 /media/ 静态别名，请勿添加 ★★
    #  全站没有任何代码会生成 /media/ 开头的网址（MEDIA_URL 零引用）。
    #  真正的读取路径是带登录与机构校验的接口：
    #      /api/v1/media/assets/{id}/content/
    #  一旦加 alias，等于「猜到文件路径即可免登录下载学生答题卡照片」。
    # ════════════════════════════════════════════════════════

    # ════════════════════════════════════════════════════════
    #  优先级 5：前端构建产物（Vite 默认 /assets/，文件名带 hash）
    # ════════════════════════════════════════════════════════
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ════════════════════════════════════════════════════════
    #  最后兜底：其它路径 → 前端单页应用
    #  前端用 history 路由，/login、/assignments/12 这些地址
    #  必须「刷新/直接打开」也能用，所以一律回 index.html。
    #  首页单独禁缓存，避免发版后看到旧页面。
    # ════════════════════════════════════════════════════════
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
